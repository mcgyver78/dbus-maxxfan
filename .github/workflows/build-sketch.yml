name: sketch

# Two things matter here. The firmware shipped in the package must match the
# sketch in the repository - a stale arduino/maxxfan_tx.hex would make the card
# offer an "update" that installs an older sketch. And the sketch has to build
# and pass its own tests.
#
# The firmware check compares the version string that the sketch writes into
# flash, not the bytes of a fresh build: two toolchain versions produce
# different binaries from identical source, and that says nothing about whether
# the firmware is current.

on:
  push:
    paths:
      - 'arduino/**'
      - 'tools/**'
      - '.github/workflows/build-sketch.yml'
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The shipped firmware matches the sketch
        run: python3 tools/check-hex.py

      - name: Build the sketch
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/bin" sh
          export PATH="$HOME/bin:$PATH"
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile -b arduino:avr:nano:cpu=atmega328 \
            --output-dir /tmp/build arduino/maxxfan_tx
          ls -l /tmp/build/maxxfan_tx.ino.hex

      - name: Upload the freshly built firmware
        uses: actions/upload-artifact@v4
        with:
          name: maxxfan_tx-hex
          path: /tmp/build/maxxfan_tx.ino.hex

      - name: Sketch tests
        run: |
          cd tools/test-sketch
          g++ -std=c++17 -D__AVR_ATmega328P__ -I. -include Arduino.h \
              -x c++ ../../arduino/maxxfan_tx/maxxfan_tx.ino lines_main.cpp \
              -o /tmp/test-sketch -Wall -Wextra
          /tmp/test-sketch

  driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyserial
      - name: Driver tests
        run: python3 tools/test-driver-logic.py
      - name: Programmer tests
        run: python3 tools/test-flash.py
      - name: Encoder against the recorded remote signals
        run: |
          curl -fsSLO https://raw.githubusercontent.com/skypeachblue/maxxfan-reversing/main/Maxxfan_collection.ir
          python3 tools/verify-encoder.py Maxxfan_collection.ir | tail -1
